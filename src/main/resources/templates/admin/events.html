<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manage Events | Seatify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Manage Events</h2>
    <a href="/admin/events/add" class="btn btn-primary">Add Event</a>
  </div>

  <div th:if="${successMessage}" class="alert alert-success"
       th:text="${successMessage}"></div>

  <div th:if="${errorMessage}" class="alert alert-danger"
       th:text="${errorMessage}"></div>

  <div class="card shadow-sm">
    <div class="card-body">

      <div class="table-responsive">
        <table class="table table-hover align-middle">

          <thead>
          <tr>
            <th>ID</th>
            <th>Event</th>
            <th>Category</th>
            <th>Venue</th>
            <th>Date</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="event : ${events}">
            <td th:text="${event.id}"></td>
            <td th:text="${event.name}"></td>
            <td th:text="${event.category.name}"></td>
            <td th:text="${event.venue.name}"></td>
            <td th:text="${event.eventDate}"></td>
            <td th:text="${event.price}"></td>
            <td>
                            <span class="badge bg-primary"
                                  th:text="${event.status}"></span>
            </td>
            <td>
              <a th:href="@{/admin/events/edit/{id}(id=${event.id})}"
                 class="btn btn-sm btn-warning">Edit</a>

              <form th:action="@{/admin/events/delete/{id}(id=${event.id})}"
                    method="post" class="d-inline">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="btn btn-sm btn-danger"
                        onclick="return confirm('Delete this event?')">
                  Delete
                </button>
              </form>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(events)}">
            <td colspan="8" class="text-center text-muted">
              No events found.
            </td>
          </tr>
          </tbody>

        </table>
      </div>

      <a href="/admin" class="btn btn-secondary">Back to Dashboard</a>

    </div>
  </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Event | Seatify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

  <div class="card shadow-sm mx-auto" style="max-width: 750px;">
    <div class="card-body p-4">

      <h2 class="mb-4">Add New Event</h2>

      <div th:if="${errorMessage}" class="alert alert-danger"
           th:text="${errorMessage}"></div>

      <form th:action="@{/admin/events/add}" method="post">

        <input type="hidden" th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="mb-3">
          <label class="form-label">Event Name</label>
          <input type="text" name="name" class="form-control"
                 maxlength="150" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control"
                    rows="3"></textarea>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Category</label>
            <select name="categoryId" class="form-select" required>
              <option value="">Select Category</option>
              <option th:each="category : ${categories}"
                      th:value="${category.id}"
                      th:text="${category.name}"></option>
            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Venue</label>
            <select name="venueId" class="form-select" required>
              <option value="">Select Venue</option>
              <option th:each="venue : ${venues}"
                      th:value="${venue.id}"
                      th:text="${venue.name}"></option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Event Date</label>
            <input type="date" name="eventDate"
                   class="form-control" required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Price</label>
            <input type="number" name="price" step="0.01"
                   min="0.01" class="form-control" required>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Start Time</label>
            <input type="time" name="startTime"
                   class="form-control" required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">End Time</label>
            <input type="time" name="endTime"
                   class="form-control">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Image URL</label>
          <input type="url" name="imageUrl" maxlength="500"
                 class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">
          Add Event
        </button>

        <a href="/admin/events" class="btn btn-secondary">
          Cancel
        </a>

      </form>

    </div>
  </div>

</div>

</body>
</html>

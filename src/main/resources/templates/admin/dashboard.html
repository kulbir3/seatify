<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | Seatify</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
      background: #f5f6fa;
    }

    .sidebar {
      min-height: 100vh;
      background: #212529;
    }

    .sidebar a {
      display: block;
      color: #ced4da;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 6px;
      margin-bottom: 5px;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: #343a40;
      color: white;
    }

    .stat-card {
      border: none;
      border-radius: 12px;
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-4px);
    }

    .stat-number {
      font-size: 30px;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <div class="col-md-2 sidebar p-3">

      <h4 class="text-white mb-4">Seatify Admin</h4>

      <a href="/admin" class="active">Dashboard</a>
      <a href="/admin/events">Manage Events</a>
      <a href="/admin/categories">Manage Categories</a>
      <a href="/admin/venues">Manage Venues</a>
      <a href="/admin/bookings">Manage Bookings</a>

      <hr class="text-secondary">

      <a href="/">Visit Website</a>

      <form th:action="@{/logout}" method="post">
        <button type="submit"
                class="btn btn-outline-light w-100 mt-3">
          Logout
        </button>
      </form>

    </div>

    <!-- Main Content -->
    <div class="col-md-10 p-4">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2>Dashboard</h2>
          <p class="text-muted mb-0">
            Welcome to the Seatify administration panel.
          </p>
        </div>
      </div>

      <!-- Statistics -->
      <div class="row g-4">

        <div class="col-md-4">
          <div class="card stat-card shadow-sm">
            <div class="card-body">
              <h6 class="text-muted">Total Events</h6>
              <div class="stat-number text-primary"
                   th:text="${totalEvents}">0</div>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card stat-card shadow-sm">
            <div class="card-body">
              <h6 class="text-muted">Registered Accounts</h6>
              <div class="stat-number text-success"
                   th:text="${totalUsers}">0</div>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card stat-card shadow-sm">
            <div class="card-body">
              <h6 class="text-muted">Total Bookings</h6>
              <div class="stat-number text-dark"
                   th:text="${totalBookings}">0</div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card stat-card shadow-sm">
            <div class="card-body">
              <h6 class="text-muted">Confirmed Bookings</h6>
              <div class="stat-number text-success"
                   th:text="${confirmedBookings}">0</div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card stat-card shadow-sm">
            <div class="card-body">
              <h6 class="text-muted">Cancelled Bookings</h6>
              <div class="stat-number text-danger"
                   th:text="${cancelledBookings}">0</div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

</body>
</html>

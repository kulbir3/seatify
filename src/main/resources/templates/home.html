<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seatify | Events</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f5f5f5;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .events-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .event-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .category {
      color: #666;
      font-size: 14px;
    }

    .price {
      color: #198754;
      font-weight: bold;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 5px;
      background: #222;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="header">
  <div>
    <h1>Welcome to Seatify!</h1>
    <p>Discover movies, concerts, and sports events.</p>
  </div>

  <form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
  </form>
</div>

<h2>Available Events</h2>

<div class="events-container">

  <div class="event-card" th:each="event : ${events}">

    <p class="category" th:text="${event.category.name}">
      Category
    </p>

    <h3 th:text="${event.name}">Event Name</h3>

    <p th:text="${event.description}">Event description</p>

    <p>
      <strong>Venue:</strong>
      <span th:text="${event.venue.name}">Venue</span>
    </p>

    <p>
      <strong>City:</strong>
      <span th:text="${event.venue.city}">City</span>
    </p>

    <p>
      <strong>Date:</strong>
      <span th:text="${event.eventDate}">Date</span>
    </p>

    <p>
      <strong>Start time:</strong>
      <span th:text="${event.startTime}">Time</span>
    </p>

    <p class="price">
      NPR <span th:text="${event.price}">0.00</span>
    </p>

    <button type="button">View Details</button>

  </div>

</div>

<p th:if="${#lists.isEmpty(events)}">
  No events are available right now.
</p>

</body>
</html>

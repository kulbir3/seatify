<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmation | Seatify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow-sm mx-auto" style="max-width: 650px;">
    <div class="card-body p-4">

      <div class="text-center mb-4">
        <h1 class="text-success">Booking Confirmed!</h1>
        <p>Your seats have been booked successfully.</p>
      </div>

      <hr>

      <h4>Booking Details</h4>

      <p>
        <strong>Booking ID:</strong>
        <span th:text="${booking.id}"></span>
      </p>

      <p>
        <strong>Event:</strong>
        <span th:text="${booking.event.name}"></span>
      </p>

      <p>
        <strong>Booking Date:</strong>
        <span th:text="${booking.bookingDate}"></span>
      </p>

      <p>
        <strong>Status:</strong>
        <span th:text="${booking.status}"></span>
      </p>

      <h5 class="mt-4">Selected Seats</h5>

      <table class="table table-bordered">
        <thead>
        <tr>
          <th>Seat</th>
          <th>Price (NPR)</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="detail : ${bookingDetails}">
          <td th:text="${detail.seat.rowName + detail.seat.seatNumber}"></td>
          <td th:text="${#numbers.formatDecimal(detail.price, 1, 2)}"></td>
        </tr>
        </tbody>
      </table>

      <h5 class="text-end">
        Total:
        NPR <span th:text="${#numbers.formatDecimal(booking.totalAmount, 1, 2)}"></span>
      </h5>

      <div class="text-center mt-4">
        <a th:href="@{/}" class="btn btn-primary">
          Back to Home
        </a>
      </div>

    </div>
  </div>
</div>

</body>
</html>
